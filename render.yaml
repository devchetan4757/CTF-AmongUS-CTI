services:
  - type: web
    name: the-imposter-api
    runtime: python
    plan: free
    buildCommand: pip install --no-cache-dir -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://the-imposter-web.onrender.com

  - type: web
    name: the-imposter-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: ""
    routes:
      - type: rewrite
        source: /api/*
        destination: https://the-imposter-api.onrender.com/api/*
      - type: rewrite
        source: /site/*
        destination: https://the-imposter-api.onrender.com/site/*
      - type: rewrite
        source: /security/*
        destination: https://the-imposter-api.onrender.com/security/*
      - type: rewrite
        source: /*
        destination: /index.html
